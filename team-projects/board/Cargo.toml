[package]
name = "qa-board"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
# Web framework.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "macros", "form", "query"] }
axum-extra = { version = "0.9", default-features = false, features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
tower-http = { version = "0.5", features = ["limit"] }

# Storage. SQLite via sqlx with prepared statements.
sqlx = { version = "0.7", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate"] }

# Crypto-grade randomness and constant-time comparison.
rand_core = { version = "0.6", features = ["std", "getrandom"] }
subtle = "2.5"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }

# base32 encoding (RFC 4648, no padding) for human-friendly tokens.
data-encoding = "2.5"

# Serde for form / query deserialization.
serde = { version = "1", features = ["derive"] }

# CLI.
clap = { version = "4", features = ["derive"] }

# Structured logging. NOTE: do not log IPs, user-agents, tokens, or question bodies.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Templates with compile-time checked auto-escaping.
askama = "0.12"

# Errors.
anyhow = "1"
thiserror = "1"

[profile.release]
# Strip debug info to reduce attack surface of leaked binaries.
strip = "debuginfo"
# Smaller, less reflection-friendly binary.
lto = "thin"
codegen-units = 1

