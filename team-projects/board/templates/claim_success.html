<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>토큰 발급됨</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; }
  .warning { background: #fff8e0; border: 2px solid #e6b800; border-radius: 4px; padding: 1em; margin: 1em 0; }
  .warning b { color: #b87100; }
  .token-list { margin: 1.5em 0; }
  .token {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.3em;
    padding: 0.8em;
    background: #f4f6f9;
    border: 1px solid #ccc;
    border-radius: 4px;
    margin: 0.5em 0;
    word-break: break-all;
    letter-spacing: 0.1em;
    user-select: all;
  }
  .actions { margin: 1.5em 0; }
  .actions a { display: inline-block; padding: 0.6em 1.2em; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; margin-right: 0.5em; }
  .help { color: #555; font-size: 0.9em; line-height: 1.5; }
</style>
</head>
<body>
<h1>토큰 {{ tokens.len() }}개가 발급되었습니다</h1>

<div class="warning">
  <b>⚠ 한 번만 표시됩니다.</b> 이 페이지를 닫거나 새로고침하면 같은 토큰을 다시 볼 수 없습니다. 사용 전까지 안전한 곳에 메모해 두세요.
</div>

<div class="token-list">
  {% for t in tokens %}
    <div class="token">{{ t }}</div>
  {% endfor %}
</div>

<p class="help">
  각 토큰은 <b>한 번만</b> 사용할 수 있습니다. 한 토큰을 사용해 질문을 올린 뒤, 다음 질문이 필요하면 다음 토큰을 사용하세요.
</p>

<div class="actions">
  <a href="/ask">질문하러 가기 →</a>
</div>

</body>
</html>
