<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>토큰 받기</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; }
  label { display: block; margin: 1em 0 0.4em; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 0.7em; font-family: inherit; font-size: 1.1em; border: 1px solid #bbb; border-radius: 4px; letter-spacing: 0.05em; }
  button { padding: 0.7em 1.4em; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
  button:hover { background: #0055aa; }
  .error { background: #fee; border: 1px solid #faa; padding: 0.7em; border-radius: 4px; margin: 1em 0; color: #800; }
  .info { color: #555; font-size: 0.9em; line-height: 1.5; background: #f4f6f9; padding: 1em; border-radius: 4px; }
  .back { display: inline-block; margin-top: 1.5em; color: #0066cc; }
</style>
</head>
<body>
<h1>토큰 받기</h1>

<p class="info">
  강의 시작 시 화면에 공지된 <b>claim code</b>를 입력하면 익명 질문 토큰을 받습니다.
  토큰은 이 페이지에서만 표시되며, 화면을 닫으면 다시 볼 수 없습니다.
  <br><br>
  한 브라우저는 같은 코드를 한 번만 사용할 수 있습니다.
</p>

{% match error %}
{% when Some with (msg) %}
  <div class="error">{{ msg }}</div>
{% when None %}
{% endmatch %}

<form method="post" action="/claim" autocomplete="off" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf }}">

  <label for="code">Claim code</label>
  <input type="text"
         id="code"
         name="code"
         required
         autofocus
         autocomplete="off"
         autocorrect="off"
         autocapitalize="characters"
         spellcheck="false"
         inputmode="latin"
         maxlength="64"
         value="{{ prefill_code }}"
         placeholder="예: MATH-2026-A7B2">

  <p><button type="submit">토큰 받기</button></p>
</form>

<p><a class="back" href="/">← 질문 목록으로</a></p>

</body>
</html>
