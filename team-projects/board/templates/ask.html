<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>질문하기</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.4em; }
  label { display: block; margin: 1em 0 0.4em; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 0.6em; font-family: inherit; font-size: 1em; border: 1px solid #bbb; border-radius: 4px; }
  textarea { min-height: 10em; resize: vertical; }
  button { padding: 0.6em 1.2em; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
  button:hover { background: #0055aa; }
  .error { background: #fee; border: 1px solid #faa; padding: 0.7em; border-radius: 4px; margin: 1em 0; color: #800; }
  .info { color: #555; font-size: 0.9em; line-height: 1.4; background: #f4f6f9; padding: 0.8em; border-radius: 4px; }
  .back { display: inline-block; margin-top: 1.5em; color: #0066cc; }
</style>
</head>
<body>
<h1>익명으로 질문하기</h1>

<p class="info">
  • 발급받은 토큰으로 한 번의 질문을 올릴 수 있습니다.<br>
  • 토큰과 질문은 서로 연결되지 않으며, 작성자를 식별할 수 있는 정보는 저장되지 않습니다.<br>
  • 한 번 사용한 토큰은 다시 쓸 수 없습니다.
</p>

{% match error %}
{% when Some with (msg) %}
  <div class="error">{{ msg }}</div>
{% when None %}
{% endmatch %}

<form method="post" action="/ask" autocomplete="off" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf }}">

  <label for="token">토큰</label>
  <input type="text"
         id="token"
         name="token"
         required
         autofocus
         autocomplete="off"
         autocorrect="off"
         autocapitalize="characters"
         spellcheck="false"
         inputmode="latin"
         maxlength="64"
         placeholder="예: ABCD-EFGH-IJKL-MNOP-QRST-UV">

  <label for="content">질문</label>
  <textarea id="content"
            name="content"
            required
            maxlength="2000"
            placeholder="궁금한 점을 자유롭게 적어주세요."></textarea>

  <p><button type="submit">제출</button></p>
</form>

<p><a class="back" href="/">← 질문 목록으로</a></p>

</body>
</html>
